name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native build and unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore
      # Pin Ubuntu 24.04: Playwright 1.51 does not support Ubuntu 26.04.
      - name: Native production browser smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          python -m http.server 18081 --bind 127.0.0.1 --directory dist/angular-ahorcado/browser &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:18081/ -o /dev/null
          python tests/browser_smoke.py
  docker:
    name: Docker production and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 90
      - name: Verify non-root, read-only runtime
        run: |
          test "$(docker compose exec -T ahorcado-angular id -u)" != 0
          docker compose exec -T ahorcado-angular nginx -t
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q ahorcado-angular)")" = true
      - run: python tests/http_smoke.py
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: docker compose logs --no-color
        if: always()
      - run: docker compose down --volumes
        if: always()
