name: Angular alternative CI
on:
  push:
    branches: [master, upstream/angular-alternative]
    paths: ['angular/**', '.github/workflows/angular-ci.yml']
  pull_request:
    paths: ['angular/**', '.github/workflows/angular-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: angular/.nvmrc
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: Test static web in three browsers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium firefox webkit
          python -m http.server 18081 --bind 127.0.0.1 --directory dist/angular-ahorcado/browser &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:18081/ -o /dev/null
          BROWSERS=chromium,firefox,webkit python tests/browser_smoke.py
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 90
      - run: python tests/http_smoke.py
      - name: Verify non-root runtime
        run: |
          test "$(docker compose exec -T ahorcado-angular id -u)" != 0
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q ahorcado-angular)")" = true
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python tests/browser_smoke.py
        env:
          BROWSERS: chromium,firefox,webkit
      - run: docker compose logs --no-color
        if: always()
      - run: docker compose down --volumes
        if: always()
