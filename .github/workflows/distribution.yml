name: Container distribution
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and verify native architecture
        run: |
          docker build --platform linux/${{ matrix.arch }} -t ahorcado:ci .
          test "$(docker image inspect ahorcado:ci --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          docker run -d --name ahorcado-test --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18081:8080 ahorcado:ci
          for attempt in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ahorcado-test)"
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ] || [ "$(docker inspect -f '{{.State.Running}}' ahorcado-test)" != true ]; then docker logs ahorcado-test; exit 1; fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' ahorcado-test)" = healthy
          curl --retry 5 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18081/healthz
          python tests/http_smoke.py
          test "$(docker exec ahorcado-test id -u)" != 0
          docker save ahorcado:ci -o "$RUNNER_TEMP/ahorcado.tar"
          chmod 0644 "$RUNNER_TEMP/ahorcado.tar"
      - name: Scan saved image without Docker socket or credentials
        run: |
          mkdir -p scan
          docker run --rm --cap-drop ALL --security-opt no-new-privileges -v "$RUNNER_TEMP/ahorcado.tar:/scan/image.tar:ro" ghcr.io/anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe docker-archive:/scan/image.tar -o json > scan/grype.json
          python - <<'PY'
          import json, os
          with open('scan/grype.json') as f:
              report = json.load(f)
          assert isinstance(report.get('matches'), list)
          severe = [m for m in report['matches'] if m['vulnerability']['severity'].lower() in ('high','critical')]
          print('High/critical findings:', len(severe))
          for m in severe:
              print(m['vulnerability']['id'], m['artifact']['name'], m['artifact']['version'], 'fix:', m['vulnerability'].get('fix', {}))
          if severe:
              print('::warning::High or critical container advisories require review before publication')
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: grype-${{ matrix.arch }}
          path: scan/grype.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.ref_type == 'tag'
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/ahorcado.tar
          retention-days: 1
      - run: docker logs ahorcado-test
        if: failure()
      - run: docker rm -f ahorcado-test
        if: always()
  release-gate:
    permissions:
      contents: read
      actions: read
      security-events: read
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | length' | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | length' | grep -Eq '^[1-9][0-9]*$'
      - name: Block open high and critical CodeQL findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | .number' > findings.txt
          if [ -s findings.txt ]; then cat findings.txt; exit 1; fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm audit --package-lock-only --audit-level=high
  publish:
    if: github.ref_type == 'tag'
    needs: [container, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: image-*
          path: images
      - name: Publish only the tested images and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch/ahorcado.tar"
            test "$(docker image inspect ahorcado:ci --format '{{.Architecture}}')" = "$arch"
            docker tag ahorcado:ci "$image:$version-$arch"
            docker push "$image:$version-$arch"
            docker image rm ahorcado:ci "$image:$version-$arch"
          done
          docker buildx imagetools create -t "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect "$image:$version"
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$version"
          docker logout ghcr.io
