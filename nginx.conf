# A single header scope avoids losing security headers via nginx inheritance.
map $uri $ahorcado_cache {
  default "no-store";
  "~*-[a-z0-9]{8}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control $ahorcado_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'" always;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ /\. {
    deny all;
  }

  location ~* \.(css|js|map|json|woff2?|ttf|svg|jpg|jpeg|png|gif|ico)$ {
    limit_except GET { deny all; }
    try_files $uri =404;
  }

  location / {
    limit_except GET { deny all; }
    try_files $uri $uri/ /index.html;
  }
}
